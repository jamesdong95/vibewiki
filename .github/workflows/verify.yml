name: Verify VibeWiki

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-quality:
    name: Package quality (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run Ruff
        run: uv run ruff check src tests scripts
      - name: Run tests
        run: uv run pytest -q
      - name: Verify viewer JavaScript syntax
        run: >-
          node -e 'const fs=require("fs"); const html=fs.readFileSync("viewer/index.html","utf8");
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          scripts.forEach(source=>new Function(source)); console.log(`JS_SYNTAX_PASS scripts=${scripts.length}`);'

  preview:
    name: Presentation preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic repository checks
        run: python3 scripts/verify_preview.py
      - name: Check whitespace
        run: git diff --check
