name: Verify VibeWiki

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest -q

  preview:
    name: Presentation preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic repository checks
        run: python3 scripts/verify_preview.py
