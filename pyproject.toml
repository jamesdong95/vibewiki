[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibewiki"
version = "0.1.2-preview"
description = "Evidence-based product reverse engineering for AI-built codebases."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = []

[project.scripts]
vibewiki = "vibewiki.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
